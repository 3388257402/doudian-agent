# 抖店智能运营 Agent —— 运行配置（CONTRACT §8.2 逐字，字段名/嵌套层级冻结）
#
# 三条硬规则（§8.1）：
# 1. 密钥**禁止**写进本文件：只写环境变量名（*_env），真实值由 client/notifier 启动时从环境变量取。
# 2. `${VAR}` / `${VAR:-default}` 占位：未解析且无默认 → 启动期 ConfigError（不静默留空）。
# 3. 未知字段一律 ConfigError（typo 不报错 = "配置没生效但没人知道"）。
#
# 环境变量覆盖（§8.4 白名单，仅这些名字）：DATABASE_URL / CHECKPOINT_TYPE / CHECKPOINT_PATH
# / CHECKPOINT_URL / LOG_LEVEL。

app:
  name: doudian-agent
  env: dev                      # dev | prod；prod 下 dry_run=true 只告警不阻断（见 README）
  api_prefix: /api
  cors_origins: ["http://localhost:5173"]
  request_timeout_s: 30         # 单请求整体预算（含重试）；超时按 500 INTERNAL_ERROR 处理

database:
  url: "sqlite+pysqlite:///./data/doudian.db"
  echo: false
  pool_size: 5

checkpoint:
  type: sqlite                  # sqlite | postgres
  path: "data/checkpoint.db"    # type=sqlite：**文件路径**（不是 SQLAlchemy URL）
  url: ""                       # type=postgres：postgresql://user:pass@host:5432/db（必填）

doudian:
  base_url: "https://openapi-fxg.jinritemai.com"
  version: 2
  sign_method: hmac-sha256
  app_key_env: DOUDIAN_APP_KEY
  app_secret_env: DOUDIAN_APP_SECRET
  access_token_env: DOUDIAN_ACCESS_TOKEN
  dry_run: true                 # true => create_doudian_client 注入 fixtures transport（零凭据可跑）
  timeout:
    connect_s: 3.0
    read_s: 10.0
    write_s: 5.0
    pool_s: 2.0
  limits:
    max_connections: 20
    max_keepalive_connections: 10
    keepalive_expiry_s: 30.0
  rate_limit:
    rate_per_sec: 8.0
    burst: 16
    max_concurrency: 4
    max_attempts: 4             # 含首次；指数退避 + jitter（§9.2）
    backoff_base_s: 0.4
    backoff_max_s: 8.0

agent:
  max_anomalies: 20
  max_actions_per_run: 5
  approval_timeout_min: 1440    # 调度器把超时未裁决的置 expired
  auto_approve_risk: none       # none | low；critical 异常产出的动作**永不**自动通过
  recursion_limit: 50

notifier:
  mode: dry_run                 # dry_run | feishu；feishu 但缺 FEISHU_WEBHOOK_URL → 启动期 ConfigError
  feishu_webhook_env: FEISHU_WEBHOOK_URL

effects:
  windows_days: [0, 1, 3, 7]    # 必须是 [0,1,3,7] 的子集且严格升序
  scheduler_enabled: true
  poll_interval_s: 60

observability:
  log_level: INFO
  log_file: "data/logs/app.jsonl"
  redact_keys: ["app_secret", "access_token", "sign", "authorization", "cookie"]
