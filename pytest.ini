[pytest]
# 本文件存在的唯一理由：**从仓库根目录跑 `pytest` 也要能过**。
#
# 项目原本只有 `backend/pytest.ini`。在根目录执行 `pytest` 时它不会被发现，
# `asyncio_mode` 于是退回默认的 strict，所有 `async def test_...` 全部报
# "async def functions are not natively supported" —— 陌生人在根目录跑一次
# 会看到 90+ failed，然后得出"这仓库测试是坏的"这个结论（独立审查实测）。
#
# 两份配置必须保持一致；改一处就同步另一处。
testpaths = backend/tests
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:app.*
