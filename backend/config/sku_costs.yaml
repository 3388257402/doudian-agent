# SKU 成本表（商家自维护；抖店开放平台**没有**成本字段）
#
# 结构（CONTRACT §8.5）：
#   version:      可选，字符串
#   costs:        必需，sku_id -> 成本（整数分，必须 > 0）
#   effective_from: 可选，YYYY-MM-DD（只做校验与展示，不参与计算——热更新不支持，改文件要重启）
#
# 语义（§8.5，逐条都对应真实事故形态）：
#   - 没有条目的 SKU = **成本未知**，不是成本 0。它的 gross_margin 是 null，规则不触发；
#   - 空值（"sku": 后面什么都不写）、负数、float、字符串、重复 sku_id → 启动期 ConfigError；
#   - 整个文件缺失 → 记一条 warn，视为"没有配成本"（正常状态，不是错误）；
#   - 成本是配置不是数据：不进库、不做第 5 张表，改一次要重启一次（留一次 code review 的机会）。
#
# ⚠️ 下面这组数值是 demo 夹具（backend/tests/fixtures/doudian/cassettes/30_products_ok.json）
#    的三个 SKU 的**示例成本**，用于演示"亏本卖"链路：真丝衬衫两个规格成本 280 元 > 售价 199 元
#    （各亏约 40%），羊毛围巾成本 60 元（毛利约 77%）。真机部署必须换成商家自己的真实成本——
#    伪造的成本会让"是否亏本"这个判断本身失去意义（§8.5 第 1 条理由）。

version: "1"
effective_from: "2026-10-23"

costs:
  # 真丝衬衫（白/160）：售 199.00，成本 280.00 → 亏
  "3400000000000000002": 28000
  # 羊毛围巾（驼色）：售 259.00，成本 60.00 → 赚
  "3400000000000000012": 6000
  # 真丝衬衫（黑/160）：售 199.00，成本 280.00 → 亏
  "3400000000000000003": 28000
